<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.0/ 'wasm-unsafe-eval'; worker-src 'self' blob: https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.0/; connect-src 'self' https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.0/ https://cdn.jsdelivr.net/npm/onnxruntime-web@1.31.0-dev.20260914-8d85527a0/ https://huggingface.co https://cdn-lfs.hf.co https://cas-bridge.xethub.hf.co; img-src 'self' data:; style-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none';">
  <title>Check my own | Source Check Lab</title>
  <link rel="stylesheet" href="css/site.css">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/parallex-favicon-32.png">
  <link rel="apple-touch-icon" href="assets/brand/parallex-apple-touch-180.png">
</head>
<body data-page-title-key="own_title">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="site-header__inner">
      <span class="brand-lockup"><picture class="brand-mark"><source media="(prefers-color-scheme: dark)" srcset="assets/brand/parallex-mark-dark.png"><img src="assets/brand/parallex-mark.png" alt="ParalleX Labs" width="36" height="36"></picture><strong data-i18n="site_title">Source Check Lab</strong></span>
      <nav aria-label="Main">
        <ul>
          <li><a href="index.html" data-i18n="nav_home">Home</a></li>
          <li><a href="practice.html" data-i18n="nav_practice">Practice</a></li>
          <li><a href="own.html" aria-current="page" data-i18n="nav_own">Check my own</a></li>
          <li><a href="guide.html" data-i18n="nav_guide">What to look for</a></li>
          <li><a href="facilitator.html" data-i18n="nav_facilitator">Facilitator</a></li>
          <li><button type="button" id="lang-switch" class="lang-switch" data-i18n-aria="lang_switch_aria">FR</button></li>
        </ul>
      </nav>
    </div>
  </header>
  <main id="main">
    <h1 data-i18n="own_title">Check my own text</h1>
    <p class="notice" data-i18n="privacy_notice"></p>
    <div class="form-field">
      <label for="own-lang" data-i18n="own_language">Language of texts</label>
      <select id="own-lang" name="lang">
        <option value="en">English</option>
        <option value="fr">Français</option>
      </select>
    </div>
    <div class="form-field">
      <label for="own-sources" data-i18n="own_sources_label">Source text</label>
      <textarea id="own-sources" name="sources" rows="8" dir="auto" class="user-text"></textarea>
    </div>
    <div class="form-field">
      <label for="own-summary" data-i18n="own_summary_label">Summary to check</label>
      <textarea id="own-summary" name="summary" rows="6" dir="auto" class="user-text"></textarea>
    </div>
    <button type="button" class="btn" id="split-claims" data-i18n="own_split_claims">Split into claims</button>
    <button type="button" class="btn btn--secondary" id="add-claim" data-i18n="own_add_claim">Add claim</button>
    <section id="own-source-panel" class="source-panel" hidden aria-label="Sources"></section>
    <section id="claims-list" aria-label="Claims"></section>
    <div class="no-print">
      <button type="button" class="btn btn--ghost" id="export-md" data-i18n="own_export_md">Export Markdown</button>
      <button type="button" class="btn btn--ghost" id="export-csv" data-i18n="own_export_csv">Export CSV</button>
      <button type="button" class="btn btn--ghost" id="print-view" data-i18n="own_print">Print view</button>
    </div>
  </main>
  <footer class="site-footer"><div class="site-footer__inner"><p>© 2026 ParalleX Labs Inc.</p><p class="footer-disclaimer" data-i18n="fr_disclaimer_footer"></p></div></footer>
  <div id="live-region" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="js/ui/own-page.js"></script>
</body>
</html>
